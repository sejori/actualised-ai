[package]
name = "actualised-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.6"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
dotenvy = "0.15"
surrealdb = { version = "1.5.6", features = ["kv-surrealkv"] }
uuid = { version = "1.26.0", features = ["v4"] }
