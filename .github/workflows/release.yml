name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force build and publish current version to npm'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      sdk_released: ${{ steps.release.outputs['packages/sdk--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/sdk--tag_name'] }}
      version: ${{ steps.release.outputs['packages/sdk--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-native:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || needs.release-please.outputs.sdk_released == 'true' || inputs.force_publish == true }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: actualised_sdk.linux-x64-gnu.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: actualised_sdk.win32-x64-msvc.node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build native binary
        working-directory: packages/sdk
        run: pnpm run build:native

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          path: packages/sdk/${{ matrix.artifact }}
          if-no-files-found: error

  publish-npm:
    needs: [release-please, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Linux native binary
        uses: actions/download-artifact@v4
        with:
          name: native-actualised_sdk.linux-x64-gnu.node
          path: packages/sdk

      - name: Download Windows native binary
        uses: actions/download-artifact@v4
        with:
          name: native-actualised_sdk.win32-x64-msvc.node
          path: packages/sdk

      - name: Build TypeScript
        working-directory: packages/sdk
        run: pnpm run build:ts

      - name: Verify build artifacts
        working-directory: packages/sdk
        run: |
          ls -la
          ls -la dist

      - name: Publish to NPM
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access public
