name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    
    services:
      surrealdb:
        image: surrealdb/surrealdb:latest
        ports:
          - 8000:8000
        command: start --log trace --user root --pass root memory
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install
      
    - name: Build SDK
      run: pnpm --filter @actualised-ai/sdk run build
      
    - name: Install Playwright Browsers
      run: pnpm --filter @actualised-ai/web-ui exec playwright install --with-deps chromium
      
    - name: Run Playwright tests (Local Mode)
      env:
        TEST_MODE: local
      run: pnpm --filter @actualised-ai/web-ui run test:e2e
      
    - name: Run Playwright tests (Cloud Mode)
      env:
        TEST_MODE: cloud
        SURREALDB_URL: ws://127.0.0.1:8000
        SURREALDB_USER: root
        SURREALDB_PASS: root
      run: pnpm --filter @actualised-ai/web-ui run test:e2e
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: packages/web-ui/playwright-report/
        retention-days: 15
