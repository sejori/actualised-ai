name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "--cfg surrealdb_unstable"

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crates/core

    steps:
    - uses: actions/checkout@v4

    # Faster toolchain setup (no extra apt installs)
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    # Caches the full target/ dir — the main compile-time win
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "crates/core -> target"

    # cargo-nextest: parallel test runner, ~2-3x faster than cargo test
    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    # Single step: compiles + runs all tests; --no-fail-fast reports all failures
    - name: Run tests
      run: cargo nextest run --no-fail-fast
